<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Licenciamento IEMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="topbar">
    <div class="topbar-inner">
      <span class="tb-item">Acesso à Informação</span>
      <span class="tb-item">Transparência</span>
      <span class="tb-item">Ouvidoria</span>
      <span class="tb-item" id="authSlot"></span>
      <span class="tb-item">Contato</span>
      <span class="tb-item">Mapa do Site</span>
      <span class="tb-item">Acessibilidade</span>
      <span class="tb-item">A− A A+</span>
    </div>
  </div>
  <div class="mainhead">
    <div class="mainhead-inner">
      <div class="brand">
        <img src="assets/iema-logo.png" alt="IEMA — Instituto Estadual de Meio Ambiente" class="iema-logo">
      </div>
      <div class="gov">
        <img src="assets/governo-es.png" alt="Governo do Estado do Espírito Santo" class="gov-badge">
      </div>
    </div>
  </div>
  <nav class="menubar">
    <div class="menubar-inner">
      <button class="menu-btn">MENU ⌄</button>
      <div class="social">
        <span class="soc">f</span><span class="soc">ig</span><span class="soc">in</span><span class="soc">yt</span><span class="soc">⌕</span>
      </div>
    </div>
  </nav>
</header>

<div class="page-wrap">
  <p class="crumb"><a href="index.html">← Voltar para processos</a></p>
  <h1 class="page-title">Acesso do administrador</h1>
  <p class="page-sub">A consulta de processos e veículos é pública. Entre com seu usuário para cadastrar ou alterar processos.</p>

  <div id="alertaArea"></div>

  <form class="form-card login-card" id="loginForm" novalidate>
    <div class="field" id="campoUsuario">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field" id="campoSenha">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-primary" id="btnEntrar">Entrar</button>
  </form>
</div>

<script src="assets/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);

  function destinoSeguro() {
    const next = params.get("next") || "";
    return /^[a-z]+\.html(\?[A-Za-z0-9=&%_.-]*)?$/.test(next) ? next : "index.html";
  }

  function mostrarAlerta(texto, tipo) {
    document.getElementById("alertaArea").innerHTML = `<div class="alert ${tipo}">${iemaEscapeHtml(texto)}</div>`;
  }

  if (params.get("expirou")) mostrarAlerta("Sua sessão expirou. Entre novamente para continuar.", "info");

  if (iemaEstaLogado()) {
    location.replace(destinoSeguro());
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value;
    if (!usuario || !senha) {
      mostrarAlerta("Informe usuário e senha.", "error");
      return;
    }
    const btn = document.getElementById("btnEntrar");
    btn.disabled = true;
    btn.textContent = "Entrando…";

    const r = await iemaLogin(usuario, senha);
    if (r.ok && r.dados && r.dados.token) {
      iemaSalvarToken(r.dados.token);
      location.replace(destinoSeguro());
      return;
    }
    mostrarAlerta((r.dados && r.dados.erro) || "Não foi possível entrar.", "error");
    document.getElementById("senha").value = "";
    btn.disabled = false;
    btn.textContent = "Entrar";
  });
</script>

</body>
</html>
